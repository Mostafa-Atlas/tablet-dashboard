<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard Admin</title>
<link rel="stylesheet" href="css/style.css" />
<style>
body{overflow:auto}
.wrap{max-width:640px;margin:24px auto;padding:0 16px}
input,button{font-size:16px;padding:10px;border-radius:10px;border:1px solid #333;background:#161616;color:#fff}
button{background:#2b6cff;border-color:#2b6cff;cursor:pointer}
button.ghost{background:#1c1c20;border-color:#333}
.row{display:flex;gap:8px;margin:8px 0} .row input{flex:1}
li{display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #222}
a{color:#8ab4ff}
#login-card,#setup-card{max-width:380px;margin:12vh auto 0;padding:28px;background:#141417;border:1px solid #26262b;border-radius:16px;text-align:center}
#login-card h1,#setup-card h1{margin:0 0 4px} #login-card input,#setup-card input{width:100%;margin:8px 0}
#login-card button,#setup-card button{width:100%;margin-top:8px}
#login-err,#setup-err{color:#ff9a9a;min-height:20px;font-size:14px}
#login-card,#panel{display:none}
#setup-card{display:none}
.top{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <!-- First boot: create the admin account (only shown when no user exists) -->
  <div id="setup-card">
    <h1>👋 Welcome</h1>
    <p class="sub dim">Create your admin account to control the dashboard</p>
    <input id="setup-user" placeholder="Choose a username" autocomplete="username" />
    <input id="setup-pass" type="password" placeholder="Choose a password (min 6 chars)" autocomplete="new-password" />
    <input id="setup-pass2" type="password" placeholder="Repeat password" autocomplete="new-password" />
    <button id="setup-btn">Create account</button>
    <p id="setup-err"></p>
    <p><a href="/">← back to display</a></p>
  </div>

  <!-- Custom login (no browser popup) -->
  <div id="login-card">
    <h1>🔒 Admin</h1>
    <p class="sub dim">Sign in to control the dashboard</p>
    <input id="login-user" placeholder="Username" autocomplete="username" />
    <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="login-btn">Sign in</button>
    <p id="login-err"></p>
    <p><a href="/">← back to display</a></p>
  </div>

  <!-- Control panel (hidden until logged in) -->
  <div id="panel">
    <div class="top">
      <p><a href="/">← back to display</a></p>
      <button id="logout-btn" class="ghost">Log out</button>
    </div>
    <h1>Admin</h1>

    <h2>Add to-do</h2>
    <div class="row"><input id="todo-text" placeholder="New task…" /><button id="todo-add">Add</button></div>
    <ul id="list"></ul>

    <h2>Long timer (days)</h2>
    <div class="row"><input id="long-days" type="number" value="12" min="1" /><button id="long-set">Set</button></div>

    <h2>Short timer</h2>
    <div class="row">
      <input id="sh-h" type="number" value="0" min="0" max="12" placeholder="h" />
      <input id="sh-m" type="number" value="25" min="1" max="600" placeholder="m" />
      <button id="sh-start">Start</button>
    </div>
    <div class="row">
      <button id="sh-pause" class="ghost">Pause</button>
      <button id="sh-resume" class="ghost">Resume</button>
      <button id="sh-reset" class="ghost">Reset</button>
    </div>
    <p id="msg" class="sub"></p>
  </div>
</div>
<script src="js/admin.js"></script>
</body>
</html>
