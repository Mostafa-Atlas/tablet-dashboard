services:
  dashboard:
    build: .
    ports:
      - "${PORT:-1200}:1200"
    environment:
      PORT: "1200"
      DATA_DIR: /data
      PC_ALLOW_IP: "${PC_ALLOW_IP:-192.168.50.2}"
      APP_TIMEZONE: "${APP_TIMEZONE:-Africa/Cairo}"
      WEATHER_LAT: "${WEATHER_LAT:-29.9668}"
      WEATHER_LON: "${WEATHER_LON:-30.9333}"
      # Create the account via /admin. Environment passwords cannot reset it.
    volumes:
      - "${DATA_DIR:-./data}:/data"
    restart: unless-stopped
