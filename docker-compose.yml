services:
  dashboard:
    build: .
    ports:
      - "1200:1200"
    environment:
      - PORT=1200
      - WEATHER_LAT=29.9668
      - WEATHER_LON=30.9333
      # No ADMIN_USER/PASS here on purpose — create the account via /admin setup page.
    volumes:
      - ./data:/data
    restart: unless-stopped
